<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Papagamingg | Live Streaming, Overlay & Jingle</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF1F0;--card:#fff;--ink:#1D2B33;--mute:#5A6A72;--line:#D5DEDD;--acc:#2E6F72;--acc2:#B7843A;--ok:#2E7D5B;--soft:#E3EBEA;--on:#fff;--hero:linear-gradient(135deg,#2E6F72,#3B5B73);--slate:#1D2B33;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1719;--card:#162124;--ink:#E6EEEE;--mute:#97A9AE;--line:#243336;--acc:#5BB3B6;--acc2:#D9A85A;--ok:#5FD0A0;--soft:#1B2A2D;--on:#0B1416;--hero:linear-gradient(135deg,#1F4C4F,#27394A);--slate:#0B1416}}
:root[data-theme="dark"]{--bg:#0F1719;--card:#162124;--ink:#E6EEEE;--mute:#97A9AE;--line:#243336;--acc:#5BB3B6;--acc2:#D9A85A;--ok:#5FD0A0;--soft:#1B2A2D;--on:#0B1416;--hero:linear-gradient(135deg,#1F4C4F,#27394A);--slate:#0B1416}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.65 "Plus Jakarta Sans",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
main{max-width:640px;margin:auto;padding:12px 16px 60px}
.brand{display:flex;align-items:center;gap:12px;padding:8px 2px 14px}
.logo{width:42px;height:42px;border-radius:12px;background:var(--slate);color:var(--acc2);display:grid;place-items:center;font:800 20px "Plus Jakarta Sans",sans-serif;flex:none}
.brand b{display:block;font-size:17px;line-height:1.2;letter-spacing:-.01em}
.brand small{display:block;color:var(--mute);font-size:12.5px;line-height:1.35}
.sw{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--soft);padding:4px;border-radius:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;border:1px solid var(--line)}
.sw button{border:0;border-radius:9px;padding:10px 2px;background:none;color:var(--mute);font:600 13px "Plus Jakarta Sans",sans-serif;cursor:pointer;transition:background .15s,color .15s}
.sw button.on{background:var(--card);color:var(--acc);box-shadow:0 1px 3px #1d2b3326}
.hero{background:var(--hero);color:#fff;border-radius:18px;padding:26px 22px;margin:14px 0}
.hero h1{font-size:25px;line-height:1.2;margin:0 0 8px;letter-spacing:-.02em;font-weight:800}
.hero p{margin:0;color:#ffffffdb;font-size:15px}
h2{font-size:18px;margin:28px 0 8px;letter-spacing:-.01em;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:10px 0}
ul.ck{list-style:none;padding:0;margin:0}
ul.ck li{padding:6px 0 6px 30px;position:relative}
ul.ck li::before{content:"\2713";position:absolute;left:0;top:7px;width:21px;height:21px;border-radius:50%;background:var(--soft);color:var(--ok);font-weight:700;font-size:12px;display:grid;place-items:center}
.pr{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.pr b{font-size:24px;color:var(--acc);letter-spacing:-.02em}
